<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Design Example</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    h2 {
      margin-top: 40px;
    }

    /* Demo 1: fluid heading size with clamp(), no media query needed */
    .fluid-heading {
      font-size: clamp(1.2rem, 4vw, 2.5rem);
      margin: 0 0 10px;
    }

    /* Demo 2: mobile-first card layout */
    .cards {
      display: grid;
      grid-template-columns: 1fr;
      /* base: one column on small screens */
      gap: 10px;
    }

    .cards .card {
      background: #d9e8ff;
      padding: 20px;
      text-align: center;
    }

    /* tablet and up: two columns */
    @media (min-width: 600px) {
      .cards {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* desktop and up: three columns */
    @media (min-width: 900px) {
      .cards {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    /* Demo 3: flexible image, never larger than its container */
    .responsive-img-wrapper {
      max-width: 400px;
      border: 1px solid #ccc;
    }

    .responsive-img-wrapper img {
      max-width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>

<body>

  <h1 class="fluid-heading">Resize the window to see this heading scale</h1>

  <h2>Mobile-first card grid</h2>
  <p>One column below 600px, two columns from 600px, three columns from 900px.</p>
  <div class="cards">
    <div class="card">Card 1</div>
    <div class="card">Card 2</div>
    <div class="card">Card 3</div>
  </div>

  <h2>Flexible image</h2>
  <p>This image never grows past its own size, but shrinks to fit a narrow container.</p>
  <div class="responsive-img-wrapper">
    <img src="../images/07-responsive-design-media-queries.jpg" alt="Example responsive image placeholder" />
  </div>

</body>

</html>
